<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <!-- 红蓝渐变，用于边框 -->
    <linearGradient id="rb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F40027">
        <animate attributeName="stop-color" values="#F40027;#1E90FF;#F40027" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1E90FF">
        <animate attributeName="stop-color" values="#1E90FF;#F40027;#1E90FF" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- 背景（透明或白色，按需改 fill） -->
  <rect x="0" y="0" width="900" height="600" fill="none"/>

  <!-- 动态边框：粗描边 + 渐变 -->
  <rect x="10" y="10" width="880" height="580" rx="18" ry="18"
        fill="none" stroke="url(#rb)" stroke-width="6">
    <!-- 让描边有呼吸感（可选） -->
    <animate attributeName="stroke-width" values="4;8;4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== 下面开始放你的内容，坐标自己调 ===== -->

  <!-- 顶部 Banner（capsule-render） -->
  <image href="https://capsule-render.vercel.app/api?type=waving&color=F40027&height=120&section=header&text=Hello%20Welcome%20Here&fontSize=40&fontColor=ffffff"
         x="20" y="20" width="860" height="120" preserveAspectRatio="xMidYMid meet"/>

  <!-- KFC Logo -->
  <image href="kfc.svg" x="390" y="160" width="120" height="120" preserveAspectRatio="xMidYMid meet"/>

  <!-- KFC Badge -->
  <image href="https://img.shields.io/badge/KFC-F40027?style=for-the-badge&logo=kfc&logoColor=white"
         x="330" y="300" width="240" height="40" preserveAspectRatio="xMidYMid meet"/>

  <!-- 打字机 -->
  <image href="https://readme-typing-svg.demolab.com?lines=It's+Finger+Lickin'+Good;DkoBot's+GitHub+Kitchen;Serving+code+since+day+one&font=Fira+Code&color=F40027&size=22&width=600&height=60&center=true"
         x="150" y="370" width="600" height="60" preserveAspectRatio="xMidYMid meet"/>

  <!-- 底部四个小图标 -->
  <image href="burger.svg" x="250" y="470" width="80" height="80"/>
  <image href="chlick.svg" x="350" y="470" width="80" height="80"/>
  <image href="clor.svg"   x="450" y="470" width="80" height="80"/>
  <image href="kfc.svg"    x="550" y="470" width="80" height="80"/>

</svg>
